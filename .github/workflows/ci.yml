name: CI

# Проверки на каждый пуш и каждый PR. Держать зелёным: сюда попадают ровно те
# ошибки, которые человек не замечает неделями — сломанная типизация, забытая
# ветка кода, упавший тест.
on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    # Тесты, которым нужна настоящая база (маршруты API, сервисы, обработчики
    # бота), гоняются здесь же: без этого они были бы «зелёными» только на
    # машине разработчика и расходились бы с кодом незаметно.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fithub_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fithub_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Prisma Client генерируется из схемы: без него не соберётся типизация
      # моделей, и typecheck упадёт на любом обращении к prisma.*
      - run: pnpm --filter bot-api prisma:generate

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      # Интеграционные тесты: схема накатывается на чистую базу сервиса,
      # дальше каждый тест стартует с пустых таблиц.
      - name: Интеграционные тесты на настоящей базе
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          DIRECT_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          pnpm --filter bot-api exec prisma migrate deploy
          pnpm test:integration

      # Сборка Mini App: ловит ошибки, которых нет в typecheck (импорты, ассеты)
      - run: pnpm --filter webapp build

      # Миграции должны накатываться на чистую базу от начала до конца.
      # Ошибка здесь означает, что прод и репозиторий разъедутся при следующем deploy.
      - name: Проверка миграций на чистом PostgreSQL
        run: |
          # Порт 5432 уже занят сервисной базой для интеграционных тестов
          docker run -d --name pg -e POSTGRES_PASSWORD=postgres -p 5440:5432 postgres:17
          for i in $(seq 1 30); do
            docker exec pg pg_isready -U postgres >/dev/null 2>&1 && break
            sleep 1
          done
          for f in apps/bot-api/prisma/migrations/*/migration.sql; do
            echo "--- $f"
            docker exec -i pg psql -U postgres -v ON_ERROR_STOP=1 -q < "$f"
          done
          echo "Таблиц в public:"
          docker exec pg psql -U postgres -At -c \
            "select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relkind='r'"
          echo "Таблиц без RLS (должно быть пусто):"
          docker exec pg psql -U postgres -At -c \
            "select string_agg(tablename,', ') from pg_tables where schemaname='public' and not rowsecurity"
